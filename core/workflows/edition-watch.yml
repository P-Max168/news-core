# 판 공백 감시 템플릿 (news-core S2). 사이트별 판 시각은 site/<lang>.json watch_slots 에서(코드에 안 박음).
# GitHub 예약은 늦거나 빠질 수 있어 매시 — 한두 번 빠져도 다음 시간에 잡음(설계서 2-5: 근본 해결은 미니PC 러너).
# (2026-10-30) 자가 복구: 오늘 판이 예정 + 30분 넘게 라이브에 없고 edition 실행도 없으면 edition.yml 을 깨운다(같은 저장소, 기본 토큰). 끄기: 변수 WATCH_DISPATCH=0
name: edition-watch
on:
  schedule:
    # CORE-PULL-KEEP
    - cron: "50 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "이슈를 열지 않고 결과만 출력"
        type: boolean
        default: false
permissions:
  contents: read
  issues: write
  actions: write   # 자가 복구: edition.yml workflow_dispatch
concurrency:
  group: edition-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Bangkok
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            tools/edition_watch.py
            tools/siteconf.py
            site
            ops/edition-fail.json
          sparse-checkout-cone-mode: false
      - name: 라이브 판 공백 확인(→ 늦으면 이슈)
        env:
          GITHUB_TOKEN: ${{ github.token }}   # edition_watch.py 는 GITHUB_TOKEN 을 읽음(GH_TOKEN 이면 무인증 → 비공개 저장소 이슈·실행 조회 실패)
          WATCH_DISPATCH: ${{ vars.WATCH_DISPATCH }}
        run: python3 tools/edition_watch.py ${{ inputs.dry_run && '--dry-run' || '' }}
